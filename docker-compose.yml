# DevOps for WeWatch - Complete Educational Guide

**Goal**: Understand and implement DevOps practices for WeWatch  
**Duration**: 3-4 hours learning + implementation  
**Outcome**: Automated testing, containerized app, professional deployment workflow

---

## 📚 Part 1: Understanding Docker (You Already Use It!)

### What You're Already Doing with LiveKit

When you run:
```bash
docker run --rm \
  -p 7880:7880 \
  -p 7881:7881 \
  -p 7882:7882 \
  -e LIVEKIT_KEYS='{"dev-key":"a77cf9f63f8e47f9fdd9d1550e129731"}' \
  -e LIVEKIT_DEVELOPMENT=true \
  livekit/livekit-server
```

**What's happening:**
1. `docker run` = "Start a container"
2. `--rm` = "Delete this container when it stops" (cleanup)
3. `-p 7880:7880` = "Connect port 7880 inside container to port 7880 on your computer"
4. `-e LIVEKIT_KEYS='...'` = "Set environment variable inside container"
5. `livekit/livekit-server` = "Use this pre-built image"

**In plain English:**
Docker takes the LiveKit server software, packages it with everything it needs (Linux, dependencies, config), and runs it in isolation on your computer. You don't have to install LiveKit directly - Docker handles everything.

---

### Why Docker Solves Real Problems

#### Problem 1: "Works on My Machine" Syndrome

**Without Docker:**
- Your computer: Go 1.24, Node 20, PostgreSQL 15, Ubuntu 22.04 → **WeWatch works ✅**
- Your friend's computer: Go 1.22, Node 18, PostgreSQL 14, macOS → **WeWatch breaks ❌**
- Production server: Go 1.23, Node 19, PostgreSQL 13, CentOS → **WeWatch breaks ❌**

**With Docker:**
- Your Dockerfile says: "Use Go 1.24, Node 20, PostgreSQL 15, Alpine Linux"
- Docker builds that exact environment
- **Everyone** (you, friend, production) runs the SAME environment → **WeWatch works everywhere ✅✅✅**

#### Problem 2: Complex Setup

**Without Docker (manual setup):**
```bash
# New developer joining your project must:
1. Install Go 1.24
2. Install Node 20
3. Install PostgreSQL 15
4. Configure PostgreSQL (create database, set password)
5. Clone WeWatch repo
6. Install Go dependencies
7. Install Node dependencies
8. Set up .env file
9. Run migrations
10. Start backend
11. Start frontend
Total time: 2-4 hours (if everything works)
```

**With Docker:**
```bash
# New developer:
docker-compose up

Total time: 5 minutes
```

Docker automates ALL the setup steps.

---

### Docker Core Concepts (Simple Explanations)

#### 1. **Container** = Lightweight Virtual Machine
- Like a mini-computer inside your computer
- Isolated: Has its own filesystem, network, processes
- Fast: Starts in 1-2 seconds (vs 30+ seconds for VM)
- Example: Your LiveKit container runs LiveKit server without affecting your main system

#### 2. **Image** = Blueprint for Container
- Like a recipe or template
- Contains: OS (Ubuntu/Alpine), software (Go/Node), your code
- Read-only: You can't change an image, you create new versions
- Example: `livekit/livekit-server` is an image someone else built and published

#### 3. **Dockerfile** = Instructions to Build Image
- Plain text file listing steps to create image
- Like cooking instructions: "Start with base ingredient, add this, cook that"
- Example (simple):
  ```dockerfile
  FROM golang:1.24          # Start with Go installed
  COPY . /app               # Copy my code into image
  RUN go build              # Compile code inside image
  CMD ["./main"]            # Run this when container starts
  ```

#### 4. **Docker Compose** = Orchestrator for Multiple Containers
- Runs multiple containers together (backend + frontend + database)
- Defines how containers communicate
- One command to start/stop everything
- Example: `docker-compose up` starts WeWatch backend, frontend, PostgreSQL, and LiveKit all at once

---

### Visual Analogy: Restaurant Kitchen

**Without Docker:**
- Chef 1 uses electric stove, Chef 2 uses gas stove, Chef 3 uses induction
- Recipe says "medium heat" but every stove is different → **Inconsistent food**

**With Docker:**
- Every chef gets identical portable kitchen (container) with same stove (environment)
- Recipe works exactly the same for everyone → **Consistent food**

**Dockerfile** = Recipe instructions (how to set up kitchen)  
**Image** = Portable kitchen kit  
**Container** = Chef cooking in that kitchen  
**Docker Compose** = Restaurant manager coordinating all chefs

