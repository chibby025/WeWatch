<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9fafb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Main Background -->
  <rect width="600" height="400" fill="url(#whiteGradient)" rx="12" ry="12"/>
  
  <!-- Top Edge -->
  <line x1="0" y1="0" x2="600" y2="0" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Decorative Corner Elements -->
  <circle cx="30" cy="370" r="30" fill="rgba(220,38,38,0.03)"/>
  <circle cx="570" cy="370" r="30" fill="rgba(220,38,38,0.03)"/>
  
  <!-- Subtle Side Borders -->
  <rect x="0" y="20" width="3" height="360" fill="rgba(220,38,38,0.1)" rx="1.5"/>
  <rect x="597" y="20" width="3" height="360" fill="rgba(220,38,38,0.1)" rx="1.5"/>
  
  <!-- Content Area Guide (will be replaced with actual form) -->
  <rect x="40" y="40" width="520" height="320" fill="transparent" stroke="rgba(0,0,0,0.05)" stroke-width="1" stroke-dasharray="5,5" rx="8"/>
  
  <!-- Bottom Security Strip -->
  <rect x="0" y="380" width="600" height="20" fill="rgba(220,38,38,0.05)"/>
  <text x="300" y="393" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="rgba(220,38,38,0.4)" text-anchor="middle" letter-spacing="1">WEWATCH SECURE TRANSACTION</text>
</svg>
