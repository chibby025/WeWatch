<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>
  
  <!-- Main Background with Gradient -->
  <rect width="600" height="280" fill="url(#redGradient)" rx="12" ry="12"/>
  
  <!-- Subtle Pattern Overlay -->
  <rect width="600" height="280" fill="url(#dots)" rx="12" ry="12"/>
  
  <!-- Decorative Corner Elements -->
  <circle cx="30" cy="30" r="40" fill="rgba(255,255,255,0.05)"/>
  <circle cx="570" cy="30" r="40" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Film Strip Decoration Left -->
  <g opacity="0.15">
    <rect x="20" y="100" width="15" height="80" fill="#fff" rx="2"/>
    <rect x="20" y="110" width="15" height="8" fill="#DC2626"/>
    <rect x="20" y="130" width="15" height="8" fill="#DC2626"/>
    <rect x="20" y="150" width="15" height="8" fill="#DC2626"/>
    <rect x="20" y="170" width="15" height="8" fill="#DC2626"/>
  </g>
  
  <!-- Film Strip Decoration Right -->
  <g opacity="0.15">
    <rect x="565" y="100" width="15" height="80" fill="#fff" rx="2"/>
    <rect x="565" y="110" width="15" height="8" fill="#DC2626"/>
    <rect x="565" y="130" width="15" height="8" fill="#DC2626"/>
    <rect x="565" y="150" width="15" height="8" fill="#DC2626"/>
    <rect x="565" y="170" width="15" height="8" fill="#DC2626"/>
  </g>
  
  <!-- Title Area (Will be replaced with dynamic text) -->
  <rect x="80" y="50" width="440" height="80" fill="rgba(255,255,255,0.08)" rx="8"/>
  
  <!-- Info Fields Background -->
  <g transform="translate(80, 160)">
    <!-- Date Field -->
    <rect width="100" height="60" fill="rgba(255,255,255,0.1)" rx="6"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.6)" text-anchor="middle">DATE</text>
    
    <!-- Time Field -->
    <rect x="120" width="100" height="60" fill="rgba(255,255,255,0.1)" rx="6"/>
    <text x="170" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.6)" text-anchor="middle">TIME</text>
    
    <!-- Screen Field -->
    <rect x="240" width="100" height="60" fill="rgba(255,255,255,0.1)" rx="6"/>
    <text x="290" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.6)" text-anchor="middle">SCREEN</text>
    
    <!-- Balance Field -->
    <rect x="360" width="100" height="60" fill="rgba(255,255,255,0.1)" rx="6"/>
    <text x="410" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.6)" text-anchor="middle">BALANCE</text>
  </g>
  
  <!-- Perforated Bottom Edge -->
  <g transform="translate(0, 280)">
    <line x1="0" y1="0" x2="600" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="8,4"/>
    <!-- Perforation Circles -->
    <circle cx="30" cy="0" r="8" fill="#fff"/>
    <circle cx="90" cy="0" r="8" fill="#fff"/>
    <circle cx="150" cy="0" r="8" fill="#fff"/>
    <circle cx="210" cy="0" r="8" fill="#fff"/>
    <circle cx="270" cy="0" r="8" fill="#fff"/>
    <circle cx="330" cy="0" r="8" fill="#fff"/>
    <circle cx="390" cy="0" r="8" fill="#fff"/>
    <circle cx="450" cy="0" r="8" fill="#fff"/>
    <circle cx="510" cy="0" r="8" fill="#fff"/>
    <circle cx="570" cy="0" r="8" fill="#fff"/>
    <!-- Inner circles for perforation effect -->
    <circle cx="30" cy="0" r="6" fill="url(#redGradient)"/>
    <circle cx="90" cy="0" r="6" fill="url(#redGradient)"/>
    <circle cx="150" cy="0" r="6" fill="url(#redGradient)"/>
    <circle cx="210" cy="0" r="6" fill="url(#redGradient)"/>
    <circle cx="270" cy="0" r="6" fill="url(#redGradient)"/>
    <circle cx="330" cy="0" r="6" fill="url(#redGradient)"/>
    <circle cx="390" cy="0" r="6" fill="url(#redGradient)"/>
    <circle cx="450" cy="0" r="6" fill="url(#redGradient)"/>
    <circle cx="510" cy="0" r="6" fill="url(#redGradient)"/>
    <circle cx="570" cy="0" r="6" fill="url(#redGradient)"/>
  </g>
  
  <!-- WeWatch Branding (subtle) -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="2">WEWATCH</text>
</svg>
