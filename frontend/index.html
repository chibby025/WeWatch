    <!-- ✅ POLYFILL FOR simple-peer -->
    <script>
      if (typeof global === 'undefined') {
        window.global = window; // Polyfill 'global' with 'window'
      }
    </script>
    <!-- ✅ END POLYFILL -->
    <!-- 🐛 ERUDA MOBILE CONSOLE (activated with ?eruda=true) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      // Check for ?eruda=true in URL or localStorage
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('eruda') === 'true' || localStorage.getItem('active-eruda') === 'true') {
        eruda.init();
        localStorage.setItem('active-eruda', 'true'); // Remember preference
        console.log('🐛 Eruda mobile console enabled');
      }
      // Allow disabling with ?eruda=false
      if (urlParams.get('eruda') === 'false') {
        localStorage.removeItem('active-eruda');
      }
    </script>
    <!-- ✅ END ERUDA -->
  <style>
    body { background-color: #0f0f17; margin: 0; }
    #root:empty {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0f0f17;
    }
    #root:empty::after {
      content: '';
      width: 48px; height: 48px;
      border: 3px solid #7c3aed;
      border-top-color: transparent;
      border-radius: 50%;
      animation: _spin .8s linear infinite;
    }
    @keyframes _spin { to { transform: rotate(360deg); } }
  </style>
