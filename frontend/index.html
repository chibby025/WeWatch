<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Vite + React</title>
    <!-- ✅ ADD INTER FONT FROM GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- ✅ PAYSTACK INLINE JS -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <!-- ✅ POLYFILL FOR simple-peer -->
    <script>
      if (typeof global === 'undefined') {
        window.global = window; // Polyfill 'global' with 'window'
      }
    </script>
    <!-- ✅ END POLYFILL -->
    <!-- 🐛 ERUDA MOBILE CONSOLE (activated with ?eruda=true) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      // Check for ?eruda=true in URL or localStorage
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('eruda') === 'true' || localStorage.getItem('active-eruda') === 'true') {
        eruda.init();
        localStorage.setItem('active-eruda', 'true'); // Remember preference
        console.log('🐛 Eruda mobile console enabled');
      }
      // Allow disabling with ?eruda=false
      if (urlParams.get('eruda') === 'false') {
        localStorage.removeItem('active-eruda');
      }
    </script>
    <!-- ✅ END ERUDA -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
