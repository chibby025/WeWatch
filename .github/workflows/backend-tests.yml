name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'tests/backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'tests/backend/**'

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: wewatch_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      - name: Run unit tests (utils)
        working-directory: backend
        env:
          JWT_SECRET: test_jwt_secret_for_ci
        run: |
          go test ./internal/utils -v -coverprofile=unit_coverage.out -covermode=atomic

      - name: Run integration tests (handlers)
        working-directory: backend
        env:
          JWT_SECRET: test_jwt_secret_for_ci
          TEST_DATABASE_URL: "host=localhost user=postgres password=testpass dbname=wewatch_test port=5433 sslmode=disable"
        run: |
          go test ./internal/handlers -v -coverprofile=integration_coverage.out -covermode=atomic
        continue-on-error: true

      - name: Run legacy tests
        working-directory: backend
        env:
          JWT_SECRET: test_jwt_secret_for_ci
        run: |
          go test ./tests/backend/... -v
        continue-on-error: true

      - name: Generate coverage report
        working-directory: backend
        run: |
          go test ./internal/utils ./internal/handlers -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.out
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Coverage Summary
        working-directory: backend
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -n 1 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Archive coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.out
